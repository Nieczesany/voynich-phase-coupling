ef polar_unwrap(gray_or_bw, center, radius, output_shape=None, flags=None):
    if flags is None:
        flags = cv2.WARP_FILL_OUTLIERS + cv2.WARP_POLAR_LINEAR
    if output_shape is None:
        output_shape = (720, radius)

    if isinstance(center, (int, float)):
        center_tuple = (float(center), float(center))
    else:
        center_tuple = (float(center[0]), float(center[1]))

    polar = cv2.warpPolar(
        gray_or_bw,
        dsize=output_shape,
        center=center_tuple,
        maxRadius=float(radius),
        flags=flags
    )
    return polar
